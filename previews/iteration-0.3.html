<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三急导航 · 界面预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeeaf4;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#302443}.wrap{max-width:420px;margin:24px auto}.caption{text-align:center;color:#736b80;font-size:13px;margin:15px}.phone{background:#f8f6fc;border:8px solid #302443;border-radius:40px;overflow:hidden;box-shadow:0 20px 70px #38255422}.bar{padding:16px 22px 12px;display:flex;justify-content:space-between;font-size:13px}.nav{text-align:center;padding:8px 15px 18px;font-size:15px}.search{padding:20px;background:white}h1{font-size:25px;margin:0 0 16px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}select{border:0;background:#f1eafa;color:#6138a5;font-size:17px;font-weight:600;padding:10px;border-radius:10px;max-width:180px}button{border:0;border-radius:9px;padding:12px;background:#f1edf6;color:#574764;cursor:pointer;font-size:14px}.locate{font-size:12px;padding:9px}.categories{display:flex;gap:8px;margin:16px 0}.categories button{flex:1}.active,.primary{background:#7546c8!important;color:white!important}input{width:100%;padding:14px;border:1px solid #ded5eb;border-radius:10px;font-size:14px}.actions{display:flex;gap:10px;margin:12px 0}.actions button{flex:1}.note{font-size:12px;color:#736b80;line-height:1.7}.tabs{display:flex;padding:12px 18px;gap:10px}.tabs button{flex:1;background:transparent}.results{padding:0 18px 18px;min-height:270px}.card{padding:16px;margin-bottom:12px;background:white;border:1px solid #e5ddef;border-radius:12px}.name{font-size:17px;font-weight:600}.distance{color:#7546c8;font-size:14px;font-weight:600;margin:8px 0}.aed{background:#fff8e9;color:#896024;padding:10px;border-radius:8px;margin-top:10px;font-size:12px;line-height:1.6}.map{height:275px;border-radius:14px;background:repeating-linear-gradient(0deg,transparent 0 55px,#fff 55px 63px),repeating-linear-gradient(90deg,#e8e4ef 0 62px,#fff 62px 70px);position:relative;display:flex;align-items:center;justify-content:center}.pin{background:#7546c8;color:white;padding:14px;border-radius:30px;box-shadow:0 4px 20px #7546c855}.bottom{width:110px;height:5px;background:#302443;border-radius:5px;margin:12px auto}.tip{padding:0 18px 12px;font-size:11px;color:#8a7e97} @media(max-width:460px){.wrap{margin:0 auto}.phone{border:0;border-radius:0}.caption{padding:8px;margin:0}.bottom{display:none}}
</style><div class="wrap"><div class="caption">0.3 交互设计预览 · 示例数据，非真实查询</div><div class="phone"><div class="bar"><b>9:41</b><span>◉ ▰</span></div><div class="nav">三急导航</div><section class="search"><h1>急需的，就在附近</h1><div class="note" style="margin-bottom:14px">找厕所 · 找 AED · 找停车场</div><div class="row"><select id="city" aria-label="切换城市"></select><button class="locate" onclick="document.querySelector('#city').value='上海';render()">⌖ 定位当前城市</button></div><div class="categories" id="categories"></div><input placeholder="输入地点、地铁站或设施名称（可选）" id="query"><div class="actions"><button class="primary" id="search">搜索厕所</button><button onclick="render()">查找附近</button></div><div class="note">城市搜索无需定位；附近结果不代表地铁站内或站台设施。</div><div id="warning"></div></section><div class="tabs"><button id="list">列表 3</button><button id="map">地图</button></div><section class="results" id="results"></section><div class="tip">预览中的城市定位、点位和距离均为演示。正式小程序使用授权定位与高德查询。</div><footer style="text-align:center;padding:18px;border-top:1px solid #e5ddef"><div class="note">联系我</div><button id="contact" style="background:transparent;color:#7546c8">微信 HiYunhe · 点击复制</button></footer><div class="bottom"></div></div></div><script>
const cities=['上海','北京','广州','深圳','杭州','南京','苏州','宁波','福州','成都','武汉','西安','重庆','天津','合肥','长沙','郑州','济南','青岛','厦门'];const labels={toilet:'厕所',aed:'AED',parking:'停车场'};let category='toilet',view='list';const city=document.querySelector('#city');cities.forEach(c=>city.add(new Option(c,c)));city.onchange=()=>{view='list';render()};function render(){document.querySelector('#categories').innerHTML=Object.entries(labels).map(([k,v])=>`<button class="${category===k?'active':''}" data-k="${k}">${v}</button>`).join('');document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{category=b.dataset.k;render()});document.querySelector('#search').textContent='搜索'+labels[category];document.querySelector('#warning').innerHTML=category==='aed'?'<div class="aed">AED 点位信息可能不完整，设备可用性请现场确认。紧急情况请立即拨打 120。</div>':'';const names={toilet:['街道公共厕所','商场公共厕所','公园公共厕所'],aed:['公共服务中心 AED','商场 AED','体育中心 AED'],parking:['公共停车场','商场地下停车场','公园停车场']};document.querySelector('#results').innerHTML=view==='map'?'<div class="map"><span class="pin">⌖ '+labels[category]+' · 示意位置</span></div><p class="note">地图布局示意，不代表真实位置</p>':names[category].map((n,i)=>`<div class="card"><div class="name">${n} <small style="font-weight:400;color:#999">示例</small></div><div class="distance">约 ${['120 米','450 米','1.2 公里'][i]} · 直线距离</div><div class="note">${city.value} · 演示地址</div><div class="note">查看位置与导航 →</div></div>`).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{view='map';render()});}document.querySelector('#list').onclick=()=>{view='list';render()};document.querySelector('#map').onclick=()=>{view='map';render()};document.querySelector('#search').onclick=()=>{view='list';render()};render();
document.querySelector('#contact').onclick=async()=>{try{await navigator.clipboard.writeText('HiYunhe');document.querySelector('#contact').textContent='已复制微信号 HiYunhe';}catch{document.querySelector('#contact').textContent='微信号 HiYunhe，请手动复制';}};
</script></html>
