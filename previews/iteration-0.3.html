und:#7546c8;color:white;padding:14px;border-radius:30px;box-shadow:0 4px 20px #7546c855}.bottom{width:110px;height:5px;background:#302443;border-radius:5px;margin:12px auto}.tip{padding:0 18px 12px;font-size:11px;color:#8a7e97} @media(max-width:460px){.wrap{margin:0 auto}.phone{border:0;border-radius:0}.caption{padding:8px;margin:0}.bottom{display:none}}

.search-modes{display:flex}.search-modes button{flex:1;background:transparent!important}.search-modes .active{background:white!important;color:#302443!important}.facility-icon{display:flex}.categories .facility-card{font-size:14px}.categories{margin-bottom:0}.restroom-tags{display:flex;gap:6px;align-items:center;margin:10px 0}.restroom-tags span{font-size:11px;color:#65527c;background:#f2edf8;padding:3px 8px;border-radius:4px}.restroom-tags small{font-size:10px;color:#93899e}.result-title{display:flex;align-items:baseline;justify-content:space-between;gap:6px;flex-wrap:wrap}.result-title .name{flex:1;min-width:0;overflow-wrap:anywhere}.result-title .restroom-tags{margin:0 0 0 auto;gap:4px;justify-content:flex-end}.result-title .restroom-tags span{font-size:10px;font-weight:400;color:#93899e;background:#f6f4f8;padding:2px 4px;border-radius:3px}.result-location{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}.location-address{flex:1;min-width:0;overflow-wrap:anywhere}.location-action{flex-shrink:0;font-size:11px;color:#7546c8;line-height:1.7}.distance-caption{margin-left:6px;font-size:10px;font-weight:400;color:#93899e}.city-row{justify-content:flex-start;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #f0ecf4}.city-row select{background:transparent;color:#736b80;font-size:12px;font-weight:400;padding:0;max-width:150px}.city-row .locate{font-size:11px;font-weight:400;background:transparent;color:#93899e;padding:0 0 0 10px;border-left:1px solid #e5ddef;border-radius:0}.heading-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:12px}.heading-row h1{font-size:19px;flex-shrink:0;margin:0}.heading-row .city-row{margin:0;padding:0;border:0;gap:4px;justify-content:flex-end;flex-wrap:wrap}.heading-row .city-row select{font-size:11px;max-width:85px}.heading-row .locate{font-size:10px;padding-left:4px}.result-location .location-address,.result-location .location-action{line-height:20px}.metro-select-row{display:flex;gap:8px;align-items:center}.metro-select-row select{flex:1;min-width:0;font-size:12px;padding:10px 6px}

 .tabs{justify-content:center;padding:12px 18px}.tabs button{flex:initial}.view-switch{width:auto}</style><div class="wrap"><div class="caption">0.3 交互设计预览 · 示例数据，非真实查询</div><div class="phone"><div class="bar"><b>9:41</b><span>◉ ▰</span></div><div class="nav">三急导航</div><section class="search"><div class="heading-row"><h1>急需的，就在附近</h1><div class="row city-row"><select id="city" aria-label="切换城市"></select><button class="locate" onclick="document.querySelector('#city').value='上海';render()">⌖ 重新定位</button></div></div><div class="note" style="margin-bottom:14px">找厕所 · 找停车场 · 找 AED</div><div class="group-label">找什么</div><div class="categories" id="categories"></div><div class="group-label mode-label">怎么找</div><div class="search-modes"><button id="nearbyMode" class="active">附近</button><button id="addressMode">地址搜索</button><button id="metroMode">地铁线路 / 站点</button></div><div id="metroFields" hidden><div class="note" id="metroNote">先选线路，再选站点（单选）</div><div class="metro-select-row"><select id="metroLine" aria-label="地铁线路" style="width:100%;max-width:none;margin:8px 0"></select><select id="metroStation" aria-label="地铁站" style="width:100%;max-width:none" disabled></select></div></div><input placeholder="输入地点、地铁站或设施名称（可选）" id="query"><div class="actions"><button class="primary" id="search">搜索厕所</button></div><div class="note">城市搜索无需定位；附近结果不代表地铁站内或站台设施。</div><div id="warning"></div></section><div class="tabs mobile-tabs"><div class="view-switch"><button id="list" class="view-option"><span class="view-icon list-icon"><span></span><span></span><span></span></span><span>列表</span><span class="result-count">3</span></button><button id="map" class="view-option"><span class="view-icon map-icon"><span></span><span></span><span></span></span><span>地图</span></button></div></div><section class="results" id="results"></section><div class="tip">预览中的城市定位、点位和距离均为演示。正式小程序使用授权定位与高德查询。</div><footer style="text-align:center;padding:18px;border-top:1px solid #e5ddef"><div class="note">联系我</div><button id="contact" style="background:transparent;color:#7546c8">微信 HiYunhe · 点击复制</button></footer><div class="bottom"></div></div></div><script src="metro-data.js"></script><script>
const cities=['上海','北京','广州','深圳','杭州','南京','苏州','宁波','福州','成都','武汉','西安','重庆','天津','合肥','长沙','郑州','济南','青岛','厦门'];const labels={toilet:'厕所',parking:'停车场',aed:'AED'};let category='toilet',view='list';const city=document.querySelector('#city');cities.forEach(c=>city.add(new Option(c,c)));city.onchange=()=>{view='list';render()};function render(){['list','map'].forEach(m=>{const b=document.getElementById(m);b.classList.toggle('view-selected',view===m);b.setAttribute('aria-pressed',String(view===m));});document.querySelector('#categories').innerHTML=Object.entries(labels).map(([k,v])=>`<button class="facility-card ${category===k?'facility-active':''}" data-k="${k}" aria-pressed="${category===k}"><span class="facility-icon">${{toilet:'<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="4" r="2"/><path d="M3 8h6v7H8v7H6v-7H5v7H3V8Z"/><path d="M12 3h1v19h-1z" opacity=".3"/><circle cx="18" cy="4" r="2"/><path d="m16 8-3 8h3v6h2v-6h1v6h2v-6h2l-3-8z"/></svg>',aed:'♥',parking:'P'}[k]}</span><span>${v}</span><span class="selected-mark">${category===k?'✓':''}</span></button>`).join('');document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{category=b.dataset.k;render()});document.querySelector('#search').textContent=(document.querySelector('#nearbyMode').classList.contains('active')?'查找附近':'搜索')+labels[category];document.querySelector('#warning').innerHTML=category==='aed'?'<div class="aed">AED 点位信息可能不完整，设备可用性请现场确认。紧急情况请立即拨打 120。</div>':'';const names={toilet:['街道公共厕所','商场公共厕所','公园公共厕所'],aed:['公共服务中心 AED','商场 AED','体育中心 AED'],parking:['公共停车场','商场地下停车场','公园停车场']};document.querySelector('#results').innerHTML=view==='map'?'<div class="map"><span class="pin">⌖ '+labels[category]+' · 示意位置</span></div><p class="note">地图布局示意，不代表真实位置</p>':names[category].map((n,i)=>`<div class="card"><div class="result-title"><div class="name">${n} <small style="font-weight:400;color:#999">示例</small></div>${category==='toilet'&&i<2?'<div class="restroom-tags">'+(i===0?'<span>男厕</span><span>女厕</span>':'<span>第三卫生间</span>')+'</div>':''}</div><div class="distance">约 ${['120 米','450 米','1.2 公里'][i]}<span class="distance-caption">直线距离</span></div><div class="result-location"><div class="note location-address">演示街道 · 具体位置</div><div class="location-action">查看位置与导航 →</div></div></div>`).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{view='map';render()});}document.querySelector('#list').onclick=()=>{view='list';render()};document.querySelector('#map').onclick=()=>{view='map';render()};document.querySelector('#search').onclick=()=>{view='list';render()};render();
document.querySelector('#contact').onclick=async()=>{try{await navigator.clipboard.writeText('HiYunhe');document.querySelector('#contact').textContent='已复制微信号 HiYunhe';}catch{document.querySelector('#contact').textContent='微信号 HiYunhe，请手动复制';}};
let searchMode='nearby';
function setMode(mode){searchMode=mode;document.querySelector('#metroFields').hidden=mode!=='metro';document.querySelector('#query').hidden=mode!=='address';['nearby','address','metro'].forEach(m=>document.querySelector('#'+m+'Mode').classList.toggle('active',m===mode));render();}
['nearby','address','metro'].forEach(m=>document.querySelector('#'+m+'Mode').onclick=()=>setMode(m));
const lineSelect=document.querySelector('#metroLine'),stationSelect=document.querySelector('#metroStation');
function resetMetro(){const lines=window.METRO_DATA[city.value]||[];lineSelect.replaceChildren(new Option('请选择地铁线路',''));lines.forEach((l,i)=>lineSelect.add(new Option(l.name,String(i))));lineSelect.disabled=!lines.length;stationSelect.replaceChildren(new Option('请选择地铁站',''));stationSelect.disabled=true;document.querySelector('#metroNote').textContent=lines.length?'先选线路，再选站点（单选）':'该城市暂无收录的地铁数据，请使用地址搜索';}
lineSelect.onchange=()=>{stationSelect.replaceChildren(new Option('请选择地铁站',''));const line=(window.METRO_DATA[city.value]||[])[lineSelect.value];stationSelect.disabled=!line;if(line)line.stations.forEach(n=>stationSelect.add(new Option(n,n)));};
city.addEventListener('change',()=>{resetMetro();if(searchMode==='nearby')setMode('address');});resetMetro();setMode('nearby');
document.querySelector('.locate').onclick=()=>{city.value='上海';resetMetro();render();};
</script>
